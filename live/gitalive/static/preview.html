<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gita Sarathi Live · preview</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0B1022;--ink:#E9ECF6;--muted:#9AA2BE;--line:#262E48;--gold:#E8A33D}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0 0 4px}
p{color:var(--muted);margin:0 0 12px}
.frame{aspect-ratio:16/9;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000}
.frame.v{aspect-ratio:9/16;height:min(78vh,880px);width:auto;margin:0 auto}
iframe,.frame img{width:100%;height:100%;border:0;display:block}
form{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
input{background:#121933;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:inherit}
#name{width:160px}#text{flex:1;min-width:220px}
button{background:var(--gold);color:#1B1203;border:0;border-radius:8px;padding:9px 16px;font-weight:700;font:inherit;cursor:pointer}
pre{background:#121933;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12.5px;white-space:pre-wrap;color:var(--muted);margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Gita Sarathi Live · preview</h1>
  <p id="intro">This is exactly what goes on air. Ask a test question as if you were a viewer in chat (no YouTube needed).</p>
  <div class="frame" id="frame"></div>
  <form id="f"><input id="name" value="Preview viewer" aria-label="Name"><input id="text" placeholder="मुझे बहुत गुस्सा आता है, क्या करूँ?" aria-label="Question"><button>Ask on air</button></form>
  <pre id="st">loading status…</pre>
</div>
<script>
const $ = (id) => document.getElementById(id);
$("f").onsubmit = async (e) => {
  e.preventDefault();
  const r = await fetch("/preview/ask", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name: $("name").value, text: $("text").value }) });
  const j = await r.json(); $("text").value = ""; $("st").textContent = (j.queued ? "Queued. " : "Not queued. ") + JSON.stringify(j);
};
// cloud mode: show the frames being rendered for the stream (9:16); OBS mode: the overlay page OBS shows
(async () => {
  let st = {}; try { st = await (await fetch("/status")).json(); } catch {}
  const box = $("frame");
  if (st.rendered) {
    box.classList.add("v");
    const img = new Image(); img.alt = "The vertical stream, live"; box.append(img);
    const tick = () => { const n = new Image(); n.onload = () => { img.src = n.src; setTimeout(tick, 500); }; n.onerror = () => setTimeout(tick, 2000); n.src = "/frame.jpg?t=" + Date.now(); };
    tick();
    $("intro").textContent += " Sound is only in the stream itself (record a test clip with --out test.mp4 to hear it).";
  } else {
    const f = document.createElement("iframe"); f.src = "/overlay"; f.title = "Overlay"; f.allow = "autoplay"; box.append(f);
    $("intro").textContent += " Click the overlay once if your browser blocks sound.";
  }
})();
setInterval(async () => { try { $("st").textContent = JSON.stringify(await (await fetch("/status")).json(), null, 1); } catch {} }, 3000);
</script>
</body>
</html>
